services:
  grafana:
    environment:
      GF_AUTH_GENERIC_OAUTH_ENABLED: "true"
      GF_AUTH_GENERIC_OAUTH_NAME: ${GRAFANA_OIDC_NAME:-Keycloak}
      GF_AUTH_GENERIC_OAUTH_ICON: ${GRAFANA_OIDC_ICON:-signin}
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: ${GRAFANA_OIDC_CLIENT_ID:?GRAFANA_OIDC_CLIENT_ID is required}
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: ${GRAFANA_OIDC_CLIENT_SECRET:?GRAFANA_OIDC_CLIENT_SECRET is required}
      GF_AUTH_GENERIC_OAUTH_SCOPES: ${GRAFANA_OIDC_SCOPES:-openid profile email}
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: ${GRAFANA_OIDC_AUTH_URL:?GRAFANA_OIDC_AUTH_URL is required}
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: ${GRAFANA_OIDC_TOKEN_URL:?GRAFANA_OIDC_TOKEN_URL is required}
      GF_AUTH_GENERIC_OAUTH_API_URL: ${GRAFANA_OIDC_USERINFO_URL:?GRAFANA_OIDC_USERINFO_URL is required}
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: ${GRAFANA_OIDC_ALLOW_SIGN_UP:-true}
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: ${GRAFANA_OIDC_AUTO_LOGIN:-false}
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: ${GRAFANA_OIDC_ROLE_ATTRIBUTE_PATH:-contains(roles[*], 'grafana-admin') && 'Admin' || contains(roles[*], 'grafana-editor') && 'Editor' || 'Viewer'}
      GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT: ${GRAFANA_OIDC_ROLE_ATTRIBUTE_STRICT:-false}
      GF_AUTH_GENERIC_OAUTH_ALLOWED_DOMAINS: ${GRAFANA_OIDC_ALLOWED_DOMAINS:-}
      GF_AUTH_GENERIC_OAUTH_TLS_SKIP_VERIFY_INSECURE: ${GRAFANA_OIDC_TLS_SKIP_VERIFY:-false}
      GF_AUTH_GENERIC_OAUTH_USE_PKCE: ${GRAFANA_OIDC_USE_PKCE:-true}
      GF_AUTH_GENERIC_OAUTH_USE_REFRESH_TOKEN: ${GRAFANA_OIDC_USE_REFRESH_TOKEN:-true}
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: ${GRAFANA_OIDC_ALLOW_INSECURE_EMAIL_LOOKUP:-false}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:?GRAFANA_ROOT_URL is required for OAuth redirect (e.g. http://grafana.example.com)}

# =============================================================================
# Loki config — backend FILESYSTEM
# =============================================================================
# Chunks, índice y WAL todo dentro de /loki (montado desde LOKI_DATA_DIR).
# Single-node only. Para SSD multi-nodo, usar loki-s3.yaml.
# =============================================================================

auth_enabled: ${LOKI_AUTH_ENABLED:-false}

server:
  http_listen_port: 3100
  grpc_listen_port: 9095
  log_level: info
  http_server_read_timeout: 60s
  http_server_write_timeout: 60s
  grpc_server_max_recv_msg_size: 67108864   # 64 MB
  grpc_server_max_send_msg_size: 67108864

common:
  instance_addr: 127.0.0.1
  path_prefix: /loki
  replication_factor: 1
  ring:
    kvstore:
      store: inmemory

memberlist:
  join_members: []

ingester:
  chunk_idle_period: 1h
  chunk_target_size: 1572864            # 1.5 MB
  chunk_retain_period: 30s
  max_chunk_age: 2h
  wal:
    enabled: true
    dir: /loki/wal
    flush_on_shutdown: true
    replay_memory_ceiling: 256MB

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

storage_config:
  tsdb_shipper:
    active_index_directory: /loki/tsdb-index
    cache_location: /loki/tsdb-cache
    cache_ttl: 24h
  filesystem:
    directory: /loki/chunks

compactor:
  working_directory: /loki/compactor
  compaction_interval: 10m
  retention_enabled: true
  retention_delete_delay: 2h
  retention_delete_worker_count: 150
  delete_request_store: filesystem

limits_config:
  retention_period: ${LOKI_RETENTION_PERIOD:-2160h}
  ingestion_rate_mb: ${LOKI_INGESTION_RATE_MB:-4}
  ingestion_burst_size_mb: ${LOKI_INGESTION_BURST_MB:-6}
  max_query_length: ${LOKI_MAX_QUERY_LENGTH:-2161h}
  max_query_parallelism: 4
  split_queries_by_interval: 15m
  reject_old_samples: true
  reject_old_samples_max_age: 168h
  max_cache_freshness_per_query: 10m
  per_stream_rate_limit: 3MB
  per_stream_rate_limit_burst: 15MB
  volume_enabled: true

query_range:
  align_queries_with_step: true
  cache_results: true
  results_cache:
    cache:
      embedded_cache:
        enabled: true
        max_size_mb: 100

querier:
  max_concurrent: 4

frontend:
  compress_responses: true
  log_queries_longer_than: 10s
  max_outstanding_per_tenant: 2048

ruler:
  storage:
    type: local
    local:
      directory: /loki/rules
  rule_path: /loki/rules-tmp
  ring:
    kvstore:
      store: inmemory
  enable_api: true

analytics:
  reporting_enabled: ${LOKI_ANALYTICS_REPORTING:-false}

services:
  grafana:
    image: grafana/grafana:${GRAFANA_VERSION:-13.0.1}
    restart: unless-stopped
    container_name: grafana-${LOKI_INSTANCE_NAME:-default}
    user: "472:0"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_LOG_LEVEL: ${GRAFANA_LOG_LEVEL:-warn}
      LOKI_URL: ${GRAFANA_LOKI_URL:-http://loki:3100}
      LOKI_TENANT: ${LOKI_TENANT:-${LOKI_INSTANCE_NAME:-default}}
    volumes:
      - ${GRAFANA_DATA_DIR:-./data/grafana}:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports:
      - "${GRAFANA_PORT:-127.0.0.1:3000}:3000"
    networks:
      - loki
      - loki_router
    deploy:
      resources:
        reservations:
          cpus: "${GRAFANA_CPU_RESERVATION:-0.1}"
          memory: ${GRAFANA_MEMORY_RESERVATION:-128M}
        limits:
          cpus: "${GRAFANA_CPU_LIMIT:-1.0}"
          memory: ${GRAFANA_MEMORY_LIMIT:-512M}
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "3"
